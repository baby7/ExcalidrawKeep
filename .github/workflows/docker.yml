name: docker

# 只有推版本 tag（v1.2.3）时才构建并推送镜像；普通提交不触发
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: baby7/excalidraw-keep

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只在需要多架构（arm64 NAS / 树莓派）时启用；QEMU 模拟会让构建慢 5–10 倍
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 镜像是怎么打 tag 的（只由 v* tag 触发）：
      #   打 v1.2.3 tag → 1.2.3（完整版本，部署时钉版本用）、1.2（随 minor 浮动）、latest、sha-xxxxxxx
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 要出 arm64 镜像就改成下面这行并启用上面的 QEMU 步骤
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 构建缓存放 GitHub Actions，二次构建从 5–10 分钟降到 1–2 分钟
          cache-from: type=gha
          cache-to: type=gha,mode=max
