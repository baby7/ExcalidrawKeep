name: excalidraw-keep

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 画布 JSON 可能有几 MB，默认 64MB 的包上限够用；真有大图再往上调
      - --max-allowed-packet=64M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: excalidraw_keep
      MYSQL_USER: ${APP_DB_USER:-excalidraw}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:-excalidraw}
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u${APP_DB_USER:-excalidraw} -p${APP_DB_PASSWORD:-excalidraw} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      APP_PORT: 8080
      APP_DB_URL: "jdbc:mysql://db:3306/excalidraw_keep?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8"
      APP_DB_DRIVER: com.mysql.cj.jdbc.Driver
      APP_DB_USER: ${APP_DB_USER:-excalidraw}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-excalidraw}
      # update：由 Hibernate 自动建表/加列；想要完全手工管表结构就设成 validate/none
      APP_DDL_AUTO: ${APP_DDL_AUTO:-update}
      APP_MAX_SCENE_CHARS: ${APP_MAX_SCENE_CHARS:-33554432}
      APP_MAX_ATTACHMENT_BYTES: ${APP_MAX_ATTACHMENT_BYTES:-8388608}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  db-data:
