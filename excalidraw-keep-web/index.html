<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 站点图标：public/ 下的文件会被 Vite 原样拷到 dist 根目录，后端从 classpath:/static 直出 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/favicon-32x32.png" />
    <title>ExcalidrawKeep</title>
    <script>
      // 首屏先用上次用过的主题，避免深色用户看到一闪而过的白屏。
      // 真正的偏好存在数据库里，React 起来后会请求 /api/settings 覆盖它。
      (function () {
        try {
          if (window.localStorage.getItem("excalidraw-keep-theme") === "dark") {
            document.documentElement.dataset.theme = "dark";
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Excalidraw 的字体等静态资源都从根路径取；
      // 字体由 scripts/copy-fonts.mjs 从 node_modules 复制到 public/fonts。
      // 这段必须写在 bundle 之前，Excalidraw 模块加载时就会读它。
      window.EXCALIDRAW_ASSET_PATH = "/";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
